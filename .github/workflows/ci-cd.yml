name: Build, Test & Production Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        ports:
          - 8123:8123

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile & Build
        run: npm run build

      - name: Run Database Migrations
        run: npx ts-node src/db/migrate.ts

      - name: Run Production Diagnostic Suite
        run: npx ts-node src/scripts/verify-production-setup.ts

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Production Deploy (Render / Cloud Webhook)
        run: |
          echo "Triggering cloud deploy hook..."
          # curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
